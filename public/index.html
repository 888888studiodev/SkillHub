<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillHub — 团队的 Skill 知识库</title><link rel="stylesheet" href="quill.snow.css"><link rel="stylesheet" href="style.css"><script src="quill.js" defer></script><script src="editor.js" defer></script><script src="app.js" defer></script></head><body><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-icon">◇</span><span>SkillHub</span></div><div class="sidebar-body"><button class="all selected" id="all">▱ <span>全部方向</span></button><div class="tree-heading">方向 <button id="add-root" aria-label="新增大方向">＋</button></div><nav id="tree" aria-label="方向目录"></nav></div></aside><button type="button" id="sidebar-backdrop" aria-label="收起目录" tabindex="-1"></button><main><header><button id="mobile-menu" aria-label="打开目录" aria-controls="sidebar" aria-expanded="false">☰</button><div class="search"><span>⌕</span><input id="search" placeholder="搜索方向、话题或内容..." aria-label="搜索"></div><button class="primary share" id="new-post">＋ 分享 Skill</button></header><div id="content"></div></main></div><section id="document-workspace" hidden></section><dialog id="dialog"><form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close-dialog" aria-label="关闭">×</button></div><div id="dialog-fields"></div><p class="error" id="dialog-error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary" id="cancel-dialog">取消</button><button class="primary" id="submit-dialog">保存</button></div></form></dialog><div id="toast" role="status"></div></body></html>
